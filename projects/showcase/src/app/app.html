<div class="app-shell">
  <header class="topbar">

      <span class="brand-mark" aria-hidden="true">S</span>
      <span class="brand-copy">
        <strong>Storage Manager</strong>
        <span>Browser storage toolkit</span>
      </span>
    </a>

    <nav class="main-nav" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        >Inicio</a
      >
      <a routerLink="/local-storage" routerLinkActive="active">LocalStorage</a>
      <a routerLink="/cache-storage" routerLinkActive="active">Cache Storage</a>

  <main class="page-content">

  <footer class="footer">
    <span>Storage Manager <span class="footer-dot">/</span> UCEVA</span>
